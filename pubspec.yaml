name: docscan
description: SCR7PT — scan, organize, and share documents on your phone. All data stays on the device.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  camera: ^0.11.2
  image: ^4.5.4
  image_picker: ^1.2.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  permission_handler: ^12.0.1
  share_plus: ^12.0.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  connectivity_plus: ^7.3.1
  flutter_tesseract_ocr:
    path: third_party/flutter_tesseract_ocr

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/Inter-LICENSE.txt
    - assets/brand/logo-light.svg
    - assets/brand/logo-dark.svg
    - assets/brand/icon-1024.png
    - assets/tessdata_config.json
    - assets/tessdata/
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon-1024.png
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: assets/brand/icon-foreground.png
  remove_alpha_ios: true
